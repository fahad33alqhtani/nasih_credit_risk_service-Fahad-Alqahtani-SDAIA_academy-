[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nasih-service"
version = "1.0.0"
description = "Nasih credit-risk scoring service (SDA-AIE-113 capstone)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "import-linter>=2.0",
    "pandas-stubs",
]

# src layout: tests import the installed package, not the repo folder.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, pure-logic tests",
    "integration: API tests via TestClient",
    "behavioural: tests against the real model",
    "slow: excluded from the per-commit gate",
]
addopts = "-q --strict-markers --cov=nasih_service --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["nasih_service"]
omit = ["*/nasih_service/batch.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's Depends(...) default-argument idiom

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.importlinter]
root_package = "nasih_service"

[[tool.importlinter.contracts]]
name = "Layered architecture: api > adapters > service > domain"
type = "layers"
layers = [
    "nasih_service.api",
    "nasih_service.adapters",
    "nasih_service.service",
    "nasih_service.domain",
]
